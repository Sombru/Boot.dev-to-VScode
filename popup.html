<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Boot.dev to VS Code</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      body {
        box-sizing: border-box;
        width: 320px;
        margin: 0;
        padding: 16px;
        background: Canvas;
        color: CanvasText;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 18px;
        font-weight: 700;
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: color-mix(in srgb, CanvasText 72%, Canvas);
        font-size: 13px;
        line-height: 1.45;
      }

      button {
        width: 100%;
        margin-top: 14px;
        border: 0;
        border-radius: 6px;
        padding: 10px 12px;
        background: #f97316;
        color: #111827;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover {
        background: #fb923c;
      }

      button:disabled {
        cursor: progress;
        opacity: 0.68;
      }

      #status {
        min-height: 36px;
        margin-top: 12px;
        padding: 10px;
        border: 1px solid color-mix(in srgb, CanvasText 16%, Canvas);
        border-radius: 6px;
        background: color-mix(in srgb, CanvasText 5%, Canvas);
        font-size: 12px;
        line-height: 1.35;
      }

      #status[data-kind="error"] {
        border-color: #ef4444;
        background: color-mix(in srgb, #ef4444 12%, Canvas);
      }

      #status[data-kind="success"] {
        border-color: #22c55e;
        background: color-mix(in srgb, #22c55e 12%, Canvas);
      }
    </style>
  </head>
  <body>
    <h1>Boot.dev to VS Code</h1>
    <p>Export the current lesson into downloaded files you can open locally.</p>
    <button id="exportButton" type="button">Export lesson</button>
    <div id="status" role="status" aria-live="polite">Open a Boot.dev lesson, then export.</div>
    <script src="popup.js"></script>
  </body>
</html>
